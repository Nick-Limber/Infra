---
# Shared prep + installation for both server and agent nodes.
# Expects `rke2_type` to be set to "server" or "agent" by the calling role.

- name: Install base packages
  ansible.builtin.package:
    name:
      - curl
      - tar
    state: present

- name: Disable swap for this boot
  ansible.builtin.command: swapoff -a
  when: rke2_disable_swap and (ansible_swaptotal_mb | int) > 0
  changed_when: true

- name: Comment out swap entries in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'
  when: rke2_disable_swap

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - overlay
    - br_netfilter

- name: Set kernel networking parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-rke2.conf
    reload: true
  loop: "{{ sysctls | dict2items }}"
  vars:
    sysctls:
      net.ipv4.ip_forward: 1
      net.bridge.bridge-nf-call-iptables: 1
      net.bridge.bridge-nf-call-ip6tables: 1

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Disable firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    state: stopped
    enabled: false
  when: rke2_disable_firewalld and 'firewalld.service' in ansible_facts.services

- name: Disable ufw
  ansible.builtin.command: ufw --force disable
  when: rke2_disable_ufw and 'ufw.service' in ansible_facts.services
  changed_when: true

# NetworkManager must not manage the CNI interfaces, or pod networking breaks.
- name: Tell NetworkManager to ignore CNI interfaces
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/rke2-canal.conf
    mode: "0644"
    content: |
      [keyfile]
      unmanaged-devices=interface-name:flannel*;interface-name:cali*;interface-name:tunl*;interface-name:vxlan.calico;interface-name:vxlan-v6.calico;interface-name:wireguard.cali;interface-name:wg-v6.cali
  when: "'NetworkManager.service' in ansible_facts.services"
  register: nm_conf

- name: Reload NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager
    state: reloaded
  when: nm_conf is changed

- name: Create RKE2 config directory
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: "0755"

- name: Check for an existing RKE2 binary
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/rke2
    - /usr/bin/rke2
  register: rke2_bin

- name: Download the RKE2 install script
  ansible.builtin.get_url:
    url: https://get.rke2.io
    dest: /tmp/rke2-install.sh
    mode: "0700"
  when: rke2_force_install or not (rke2_bin.results | selectattr('stat.exists') | list)

- name: Install RKE2 ({{ rke2_type }})
  ansible.builtin.command: /tmp/rke2-install.sh
  environment: "{{ rke2_install_env | combine({'INSTALL_RKE2_VERSION': rke2_version} if rke2_version else {}) }}"
  vars:
    rke2_install_env:
      INSTALL_RKE2_TYPE: "{{ rke2_type }}"
      INSTALL_RKE2_CHANNEL: "{{ rke2_channel }}"
  when: rke2_force_install or not (rke2_bin.results | selectattr('stat.exists') | list)
  register: rke2_install
  changed_when: true
