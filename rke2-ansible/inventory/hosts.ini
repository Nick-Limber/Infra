# =============================================================================
# RKE2 cluster inventory
# The FIRST host under [rke2_servers] bootstraps the cluster.
# =============================================================================

[rke2_servers]
cp1 ansible_host=192.168.1.201
# For an HA control plane, add two more (3 total), e.g.:
# cp2 ansible_host=192.168.1.202
# cp3 ansible_host=192.168.1.203

[rke2_agents]
# Uncomment as you build each worker VM:
# worker1 ansible_host=192.168.1.211
# worker2 ansible_host=192.168.1.212

[rke2_cluster:children]
rke2_servers
rke2_agents

[rke2_cluster:vars]
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/id_ed25519
# Your Mac reaches the 192.168.1.x network through the XCP-ng host (Tailscale).
# Remove this line if you're on the home network, or if ~/.ssh/config already sets ProxyJump.
ansible_ssh_common_args='-o ProxyJump=root@100.116.198.31'
